<g class="ln"><rect x="144" y="208" width="46" height="42" rx="5"/><rect x="202" y="208" width="46" height="42" rx="5"/><rect x="260" y="208" width="46" height="42" rx="5"/><rect x="318" y="208" width="46" height="42" rx="5"/><rect x="376" y="208" width="46" height="42" rx="5"/></g>
<g class="ln"><rect x="144" y="264" width="46" height="42" rx="5"/><rect x="202" y="264" width="46" height="42" rx="5"/><rect x="260" y="264" width="46" height="42" rx="5"/><rect x="318" y="264" width="46" height="42" rx="5"/><rect x="376" y="264" width="46" height="42" rx="5"/></g>
<g class="ln"><rect x="144" y="320" width="46" height="42" rx="5"/><rect x="202" y="320" width="46" height="42" rx="5"/><rect x="260" y="320" width="46" height="42" rx="5"/><rect x="318" y="320" width="46" height="42" rx="5"/><rect x="376" y="320" width="46" height="42" rx="5"/></g>
