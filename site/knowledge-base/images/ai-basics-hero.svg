<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t">
<title id="t">左边是过去的软件：一堆固定按钮和菜单。右边是现在的 AI：你说一句人话，它给你结果</title>
<defs>
