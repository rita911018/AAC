<style>
/* 视频列表骨架专用 */
.sk-vlist{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sk-vcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sk-vcard .sk-thumb{position:relative;aspect-ratio:16/9;background:#163059;display:grid;place-items:center}
.sk-vcard .sk-thumb::before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.12)}
.sk-vcard .sk-thumb .play{position:relative;z-index:2;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.sk-vcard .sk-thumb .play svg{width:17px;height:17px;fill:#0E2144;margin-left:2px}
.sk-vcard .sk-thumb .sk-dur{position:absolute;z-index:2;right:12px;bottom:12px;width:42px;height:18px;border-radius:6px;background:rgba(8,18,38,.5)}
.sk-vcard .sk-body{padding:16px 18px 18px}
.sk-vcard .sk-body .sk{margin-bottom:10px}
/* ===== 真实内容排版（简约） ===== */
.rt-sec{margin-bottom:30px}
.rt-sec:last-child{margin-bottom:0}
.rt-sec h3{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rt-sec h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent,#2563EB)}
.rt-sec p{font-size:14px;color:var(--ink-700);line-height:1.75;margin-bottom:10px}
.rt-ul{margin:8px 0 14px}
.rt-ul li{position:relative;padding-left:18px;font-size:14px;color:var(--ink-700);line-height:1.7;margin-bottom:6px}
.rt-ul li::before{content:"";position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent,#2563EB)}
.rt-ul li b{color:var(--ink-900)}
.rt-code{background:#0E2144;color:#DBE7FA;border-radius:10px;padding:16px 18px;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;margin:12px 0 6px}
.rt-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0 6px}
.rt-table th{text-align:left;font-weight:600;color:var(--ink-400);font-size:12px;padding:8px 12px;border-bottom:2px solid var(--line)}
.rt-table td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-700);vertical-align:top;line-height:1.55}
.rt-table td:first-child{font-weight:600;color:var(--ink-900);white-space:nowrap}
.tl-year{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--accent,#2563EB);margin-bottom:4px}
.tl-body b{display:block;font-size:14.5px;font-weight:700;color:var(--ink-900);margin-bottom:3px}
.tl-body p{font-size:13px;color:var(--ink-500);line-height:1.6}
/* 真实视频卡 */
.rv-title{display:block;font-size:14px;font-weight:700;color:var(--ink-900);line-height:1.45;margin-bottom:8px}
.rv-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-400);margin-bottom:10px}
.rv-tagrow{display:flex;gap:6px;flex-wrap:wrap}
.rv-tagrow span{font-size:11px;color:var(--blue-600);background:var(--blue-50);border:1px solid var(--blue-100);padding:2px 9px;border-radius:99px}
.rv-badge-demo{position:absolute;z-index:2;top:12px;left:12px;font-size:11px;font-weight:600;color:#fff;background:rgba(8,18,38,.55);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:99px}
.rv-badge-real{background:var(--blue-600);border-color:transparent}
.rv-real{display:block;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s,border-color .25s}
.rv-real:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--blue-500)}
.rv-dur-txt{position:absolute;z-index:2;right:12px;bottom:12px;font-family:var(--font-mono);font-size:11px;font-weight:600;color:#fff;background:rgba(8,18,38,.6);padding:2px 8px;border-radius:6px}
/* ===== 知识卡片组件（概念卡 / 步骤 / 术语 / 时代 / 金句） ===== */
.kb-quote{position:relative;background:var(--blue-50);border:1px solid var(--blue-100);border-left:4px solid var(--accent,#2563EB);border-radius:10px;padding:16px 18px;margin:14px 0;font-size:14px;color:var(--ink-700);line-height:1.7}
.kb-quote .kq-note{display:block;margin-top:6px;font-size:12px;color:var(--ink-400)}
.kb-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:12px 0}
.kb-cards.cols3{grid-template-columns:repeat(3,1fr)}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .2s,box-shadow .2s}
.kb-card:hover{border-color:var(--accent,#2563EB);box-shadow:var(--shadow-hover)}
.kb-card .kc-tag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--accent,#2563EB);background:var(--blue-50);border:1px solid var(--blue-100);padding:1px 8px;border-radius:99px;margin-bottom:8px}
.kb-card b{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px}
.kb-card p{font-size:12.5px;color:var(--ink-500);line-height:1.55;margin:0}
.kb-steps{margin:12px 0}
.kb-step{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.kb-step:last-child{border-bottom:none}
.kb-step .ks-num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--blue-50);border:1px solid var(--blue-100);color:var(--accent,#2563EB);font-family:var(--font-mono);font-size:13px;font-weight:700;display:grid;place-items:center}
.kb-step b{display:block;font-size:14px;font-weight:700;margin-bottom:3px}
.kb-step p{font-size:13px;color:var(--ink-500);line-height:1.6;margin:0}
.kb-terms{display:grid;grid-template-columns:1fr;gap:14px;margin:12px 0}
.kb-term{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kb-term .kt-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kb-term .kt-head b{font-size:15px;font-weight:700}
.kb-term .kt-head .kt-tag{font-size:11px;font-weight:600;color:var(--accent,#2563EB);background:var(--blue-50);border:1px solid var(--blue-100);padding:1px 9px;border-radius:99px}
.kb-term .kt-row{font-size:13px;color:var(--ink-700);line-height:1.65;margin-bottom:6px}
.kb-term .kt-row:last-child{margin-bottom:0}
.kb-term .kt-row b{color:var(--ink-900);margin-right:4px}
.kb-eras{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:12px 0}
.kb-era{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:3px solid var(--accent,#2563EB)}
.kb-era .ke-year{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent,#2563EB);letter-spacing:.04em;margin-bottom:6px}
.kb-era b{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px}
.kb-era .ke-key{font-size:12.5px;color:var(--ink-700);line-height:1.55;margin-bottom:6px}
.kb-era .ke-key em{font-style:normal;font-weight:700;color:var(--accent,#2563EB)}
.kb-era p{font-size:12px;color:var(--ink-400);line-height:1.5;margin:0}
</style>

    '因为模型的本质是概率预测，而不是「检索事实」。当训练数据不足或问题含糊时，它会生成看起来通顺但错误的回答，业内称之为幻觉（Hallucination）。所以重要信息一定要让它给出来源、或人工复核。'
  ], quote:'AI 像一个记忆力超强、但偶尔说梦话的天才实习生——好用，但不能完全信。', quoteNote:'—— 关于「幻觉」最常被引用的一句比喻'},

'prompt-basics': { type:'article', secs:[
  { h:'为什么提示词这么重要？', ps:[
    '问完 AI 拿到一个看起来完整、但完全用不上的答案，问题往往不在 AI，在提示词。提示词是「你和 AI 之间的接口」——同样的模型，提示词写得好不好，产出质量可以差出 10 倍。',
    '下面 5 个方法是公认的「能立刻见效」的写法，按推荐顺序掌握就能覆盖 80% 的日常场景。'
  ]},

  { h:'方法一 · 说清楚要什么，别让 AI 猜', ps:[
    '这是最简单、也最容易被忽视的一条。AI 会尽力「推测」你的意图，但推测出来的结果往往不是你想要的。',
    '把你对结果的四个维度写完整 —— <b>格式、长度、受众、语气</b>，AI 才能交出能用的东西。'
  ], cards:[
    { tag:'含糊', t:'「帮我整理一下今天的会议内容。」', d:'AI 只能给出一份通用版纪要，可能格式不是你想要的、长短失控、要点模糊。' },
    { tag:'清晰', t:'明确格式 / 长度 / 受众 / 语气', d:'「根据以下会议记录整理成纪要。格式：【会议结论】【待办事项（含负责人和截止时间）】【下次议题】，300 字以内，语言简洁。」' }
  ], ps2:['Anthropic 的黄金法则：把提示词给一个完全不了解这件事的同事看，问他能不能照着做。如果他会懵，AI 也会懵。']},

  { h:'方法二 · 给背景，让 AI 真正理解你的处境', ps:[
    '同样是「写一封邮件」，发给老板和发给供应商完全是两种写法。AI 不了解你的处境，就只能给你一个「通用版」—— 看起来没毛病，但哪里都不对味。',
    '关键技巧：告诉 AI <b>「为什么」</b>，比告诉它「做什么」更有效。「我需要正式一点，因为对方是甲方高层」比「写正式一点」效果好得多。'
  ], cards:[
    { tag:'无背景', t:'「帮我写一封催款邮件。」', d:'AI 只能给一份「礼貌但空」的通用模板，缺少关键信息。' },
    { tag:'有背景', t:'说明金额、关系、态度、底线', d:'「催款邮件。背景：合作 3 年的老客户，账期超 30 天，金额 5 万，关系不错不想伤和气，但必须让他重视这件事。语气：委婉但明确，给对方留个台阶下。」' }
  ], ps2:['OpenAI 推荐的提示词四层结构：', '身份 Identity（扮演什么角色） + 指令 Instructions（做什么、遵守什么规则） + 示例 Examples（期望的输出长什么样） + 上下文 Context（背景、素材、文档）']},

  { h:'方法三 · 给例子，让 AI 直接照着学', ps:[
    '有一个规律：你用一千字描述想要什么格式，不如直接给 AI 一个例子看。AI 会从例子里自动归纳出规律，然后照着来。这叫 <b>Few-Shot（少样本）提示</b>，是 Anthropic 和 OpenAI 都重点推荐的技巧。'
  ], code:
'任务：把下面的事务性通知改写成我们团队的风格。\n\n我们的风格是这样的——\n【示例1】\n原文：请大家于周五前提交本月报销。\n改写：📝 提醒！本月报销截止周五，需要报销的同学记得提交，有问题找小林。\n\n【示例2】\n原文：明天上午10点有全员会议，请准时参加。\n改写：📢 明天10:00 全员大会，3楼会议室，不见不散～\n\n现在请改写：\n原文：下周一起，停车场B区暂停使用，请各位改停A区或C区。',
  ul:[
    '<b>给 3-5 个例子</b>效果最好，太少学不到规律，太多反而让 AI 注意力分散',
    '<b>例子要多样</b>，避免让 AI 学到「无意间的规律」（比如你给的例子全都以 emoji 开头，AI 可能会以为这是固定格式）'
  ]},

  { h:'方法四 · 给 AI 一个角色，让它换身份说话', ps:[
    '同一个问题，问「一个 AI」和问「一位从业 10 年的职场老鸟」，得到的答案完全不同。角色设定会让 AI 自动切换视角、语气和知识深度，一句话就能生效。'
  ], cards:[
    { tag:'无角色', t:'「帮我分析这个方案的风险。」', d:'AI 给你一份万金油式的通用风险清单，谁看都挑不出毛病，但也没人用得上。' },
    { tag:'有角色', t:'具体身份 + 行为倾向', d:'「你是一位负责过 50+ 项目的风控经理，专门挑方案里的坑。分析这个方案，不废话，直接说最可能出问题的 3 个点。」' }
  ], ps2:['四个最好用的职场角色模板：']},
  { h:'', cards:[
    { tag:'严格编辑', t:'资深商业文案编辑', d:'识别空话、废话、夸大表述和逻辑漏洞。审阅以下文字，直接指出哪里要改，不用客气。' },
    { tag:'挑剔甲方', t:'见过太多 PPT 的甲方总监', d:'对套话免疫，只关注实际价值和落地可行性。评价以下方案哪里说服不了你。' },
    { tag:'对方律师', t:'谈判对方的律师', d:'找出我方合同中对我们不利的条款和模糊之处，逐条分析。' },

  ], ps2:['进阶技巧：如果你经常用某个角色，可以把它存在「系统提示（System Prompt）」里，AI 在整个对话中始终保持这个身份，不用每次重复设定。']},

  { h:'方法五 · 让 AI 先拆解再回答，复杂问题别直接问', ps:[
    '遇到复杂问题，很多人直接问 AI「你觉得怎么办」——AI 会给你一个听起来完整、但实际上是拍脑袋得出的答案。',
    '更好的做法是：让 AI <b>先把问题拆开、一步步推理，最后才给结论</b>。这叫思维链（Chain of Thought），会让 AI 像一个认真思考的人，而不是快速拍脑袋的机器。'
  ], cards:[
    { tag:'直接问结论', t:'「我们该不该接这个客户？」', d:'AI 随机给你「可以接」或「建议谨慎」，没依据、没逻辑。' },
    { tag:'逐步分析', t:'要求分步骤输出', d:'「请先分析这个客户的优势和风险，结合我们目前的资源情况，最后给出建议和理由。」' }
  ], code:

  { h:'基础概念（先看这 6 个）', terms:[
    { t:'Token · 词元', tag:'Token', what:'大模型不是「看字」，而是「看数字」。把一句话切成若干 token，每个 token 映射到一个数字，再喂给模型。中文一般 1 个字 = 1~2 个 token，英文 1 个单词 ≈ 1 个 token。', why:'① 决定一次能喂多少字（上下文窗口按 token 算）；② 决定 API 计费；③ 模型处理长文本的「内存压力」也按 token 衡量。', eg:'句子「AI 改变工作方式」≈ 8 个 token；一段 3000 字的报告 ≈ 4500 token。' },
    { t:'Transformer · 注意力架构', tag:'Transformer', what:'谷歌 2017 年论文《Attention Is All You Need》提出的架构，核心是「自注意力机制」——模型在读一句话时，每个字都能同时关注其他所有字，因此擅长理解长距离语义关系。', why:'之前的 RNN/LSTM 必须逐字顺序读，速度慢、记不住长文；Transformer 可并行训练、能处理长文本，从此打开「大模型时代」。GPT、Claude、Gemini、Qwen、DeepSeek 全是基于 Transformer。', one:'今天所有主流大模型，本质都是「Transformer 家族的孩子」。' },
    { t:'预训练 · Pretraining', tag:'Pretraining', what:'第一阶段训练：把互联网上的书、新闻、代码、维基百科等数千亿 token 喂给模型，让它学会「下一个字该是什么」。这一阶段学到的是通用语言能力和基础知识。', why:'训练一次的成本可达数百万到数千万美元，主要花在 GPU 算力上，所以大厂都是「一次预训练、多次微调」。', one:'预训练是「读万卷书」，给模型打底。' },
    { t:'微调 · SFT', tag:'Fine-tuning', what:'第二阶段训练：用人工写好的「问题-好答案」成对数据继续训练，让模型从「会接龙」变成「会按指令干活」。客服、法律咨询等场景都靠 SFT 调出「专业话术」。', why:'相比预训练，SFT 需要的样本量小得多（几千到几万条），但能让模型行为更专业、更可控。', one:'预训练是「读万卷书」，SFT 是「拜师学艺」。' },
    { t:'上下文窗口 · Context Window', tag:'Context', what:'单次对话里，模型能读多少字（输入 + 输出），单位是 token。早期 GPT-3 只有 4K token（约 2~3 页 A4）；2026 年 Claude Opus 4.8 已支持 1M token（一整本小说）。', why:'窗口越长，能喂的参考材料越多：长合同、长代码库、长会议记录都能一次性丢进去。评估模型时，它是和「智能水平」并列的核心指标。', one:'窗口决定一次能「记住」多少。' },
    { t:'幻觉 · Hallucination', tag:'Hallucination', what:'大模型的本质是「预测最可能的下一个词」，不是「查数据库」。当训练数据不足、问题模糊或被诱导时，它会一本正经地编造数据、引文、人名。', why:'应对方法：① 重要事实人工复核；② 让模型给出来源/链接；③ 用联网搜索模式；④ 用 RAG 给模型喂真实文档。', one:'AI 像一个记忆力强但偶尔说梦话的天才实习生——好用，但不能完全信。' }
  ]},
  { h:'进阶概念（想深入再看这 6 个）', terms:[
    { t:'RLHF · 人类反馈强化学习', tag:'RLHF', what:'Reinforcement Learning from Human Feedback。SFT 之后再做一轮「评分训练」：让人类对模型多个回答排序，模型就学会「什么是更好的回答」。', why:'显著降低胡说八道、减少有害输出、提升指令遵循度。今天主流大模型几乎都用 RLHF（或它的变体 DPO、RLAIF）。', one:'用人类偏好给模型「对齐价值观」。' },
    { t:'MoE · 混合专家', tag:'MoE', what:'Mixture of Experts。一个 MoE 模型内部有几十个「专家子模型」，每次只激活其中 2~4 个来处理当前输入。', why:'总参数可能几千亿，但每次推理只调用一小部分，速度快、成本低。DeepSeek V4、Qwen 3.8、Mixtral 都用了 MoE。代价是显存占用仍是大头，适合大厂部署。', one:'模型拆成多个专家，按需激活。' },
    { t:'多模态 · Multimodal', tag:'Multimodal', what:'单模态 = 只能处理文字；多模态 = 文字、图片、音频、视频都能看懂/生成。GPT-4o、Claude Opus 4.8、Gemini 3.x 都是原生多模态模型。', why:'拍照提问、识图翻译、视频生成、语音对话、AI 看 X 光片……背后都是多模态能力。', one:'让 AI 不止会读字，还会看图听声。' },
    { t:'推理模型 · Reasoning Model', tag:'Reasoning', what:'代表模型：GPT-o 系列、DeepSeek V4 Pro、Claude 的 Extended Thinking、Qwen 3.8 Max 推理版、Gemini 2.5 Reasoning。它们在给出最终答案前会「自言自语」式拆解问题、写草稿、验算。', why:'数学题、代码调试、逻辑分析、多步推演——推理模型明显更强。代价是更慢、更贵。日常聊天、翻译、写作，普通模型就够了。', one:'会「先想后答」的慢思考模型。' },
    { t:'Agent · 智能体', tag:'Agent', what:'普通 AI = 你问它答；Agent = 你给它一个目标，它自己拆步骤、调工具（搜索、代码、API、文件、浏览器）、遇到问题自己修，最终把活干完。', why:'2025-2026 典型代表：编程方向有 OpenAI Codex、Claude Code；通用方向有 ChatGPT Agent、Manus、AutoGPT；办公方向有豆包 Agent、Kimi Agent。', one:'如果说 ChatGPT 是「会聊天的 AI」，Agent 就是「会干活的 AI 员工」。' },
    { t:'开源模型 · Open-Weight Model', tag:'Open-Weight', what:'权重公开、可私有化部署的模型。代表：Meta Llama 系列、阿里 Qwen 系列、DeepSeek 系列、Mistral、智谱 GLM、月之暗面 Kimi K2。', why:'① 数据不出公司（合规）；② 可在自有服务器/GPU 上跑；③ 可深度微调适配业务；④ 长期成本低于调用闭源 API。代价是需要懂部署、有 GPU 资源、自己做运维。', one:'中小公司往往直接调用云 API 更划算。' },
    { t:'Harness · Agent 驾驭框架', tag:'Harness', what:'2025 年下半年开始流行的概念。指一套约束、监控、审计 Agent 行为的工程框架 —— 就像给自动驾驶的「规则系统 + 黑匣子」。', why:'Agent 一旦能调工具、动文件、扣钱、出邮件，就需要 Harness 来限制可操作范围、记录决策链路、加上人工审核节点（Human-in-the-loop），避免 Agent 「跑偏」。Anthropic、OpenAI、LangChain 都在推自己的 Harness 方案。', one:'Agent 越强，Harness 越重要。' }
  ]}
]},

/* ================= 工具函数 ================= */
function qs(name){
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  if(!m) return '';
  try {
    return decodeURIComponent(m[1]);
  } catch(error) {
    return '';
  }
}
function esc(s){
  var entities = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  return String(s).replace(/[&<>"']/g,function(character){ return entities[character]; });
}
function safeOwnGet(object, key){
  if(!object || (typeof object !== 'object' && typeof object !== 'function') || typeof key !== 'string') return undefined;
  try {
    return Object.prototype.hasOwnProperty.call(object, key) ? object[key] : undefined;
  } catch(error) {
    return undefined;
  }
}
function sanitizeInlineRichText(value){
  var template = document.createElement('template');
  template.innerHTML = String(value);
  function clean(nodes){
    var html = '';
    for(var i=0;i<nodes.length;i++){
      var node = nodes[i];
      if(node.nodeType === 3){
        html += esc(node.data);
      } else if(node.nodeType === 1){
        var inner = clean(node.childNodes);
        var tag = node.tagName.toLowerCase();
        html += (tag === 'b' || tag === 'strong') ? '<' + tag + '>' + inner + '</' + tag + '>' : inner;
      }
    }
    return html;
  }
  return clean(template.content.childNodes);
}
function safeHttpUrl(value){
  try{
    var url = new URL(String(value),document.baseURI);
    if(url.protocol === 'http:' || url.protocol === 'https:') return url.href;
  }catch(e){}
  return '';
}
function syncTableScrollState(){
  var tables = document.querySelectorAll('.rt-table[data-scroll-label]');
  for(var i=0;i<tables.length;i++){
    var table = tables[i];
    if(table.scrollWidth > table.clientWidth + 1){
      table.setAttribute('tabindex','0');
      table.setAttribute('aria-label',table.getAttribute('data-scroll-label'));
    } else {
      table.removeAttribute('tabindex');
      table.removeAttribute('aria-label');
    }
  }
}
window.addEventListener('resize',syncTableScrollState);

/* ================= 内容渲染器 ================= */
function renderTimelineItems(items){
  var html = '<div class="sk-timeline">';
  for(var i=0;i<items.length;i++){
    var it = items[i];
    html += '<div class="sk-tl-item"><div class="tl-year">' + esc(it.y) + '</div>' +
      '<div class="tl-body"><b>' + esc(it.t) + '</b><p>' + esc(it.d) + '</p></div></div>';
  }
  return html + '</div>';
}

function renderArticle(c){
  var html = '';
  for(var i=0;i<c.secs.length;i++){
    var s = c.secs[i];
    html += '<div class="rt-sec">';
    if(s.h) html += '<h3>' + esc(s.h) + '</h3>';
    if(s.ps) for(var a=0;a<s.ps.length;a++) html += '<p>' + esc(s.ps[a]) + '</p>';
    if(s.ul){ html += '<ul class="rt-ul">'; for(var b=0;b<s.ul.length;b++) html += '<li>' + sanitizeInlineRichText(s.ul[b]) + '</li>'; html += '</ul>'; }
    if(s.code) html += '<div class="rt-code">' + esc(s.code) + '</div>';
    if(s.table){
      html += '<table class="rt-table" data-scroll-label="' + esc('横向滚动查看「' + (s.h || '详情内容') + '」数据表') + '"><tr>'; for(var h=0;h<s.table.head.length;h++) html += '<th scope="col">' + esc(s.table.head[h]) + '</th>'; html += '</tr>';
      for(var r=0;r<s.table.rows.length;r++){ html += '<tr>'; for(var d=0;d<s.table.rows[r].length;d++) html += '<td>' + esc(s.table.rows[r][d]) + '</td>'; html += '</tr>'; }
      html += '</table>';
    }
    // 概念卡网格
    if(s.cards){
      html += '<div class="kb-cards' + (s.cards.length===3?' cols3':'') + '">';
      for(var c1=0;c1<s.cards.length;c1++){
        var cd = s.cards[c1];
        html += '<div class="kb-card">' + (cd.tag?'<span class="kc-tag">'+esc(cd.tag)+'</span>':'') +
          '<b>'+esc(cd.t)+'</b><p>'+esc(cd.d)+'</p></div>';
      }
      html += '</div>';
    }
    // 步骤
    if(s.steps){
      html += '<div class="kb-steps">';
      for(var st=0;st<s.steps.length;st++){
        html += '<div class="kb-step"><span class="ks-num">'+(st+1)+'</span><div><b>'+esc(s.steps[st].t)+'</b><p>'+esc(s.steps[st].d)+'</p></div></div>';
      }
      html += '</div>';
    }
    // 术语卡
    if(s.terms){
      html += '<div class="kb-terms">';
      for(var t1=0;t1<s.terms.length;t1++){
        var tm = s.terms[t1];
        html += '<div class="kb-term"><div class="kt-head"><b>'+esc(tm.t)+'</b>'+(tm.tag?'<span class="kt-tag">'+esc(tm.tag)+'</span>':'')+'</div>' +
          (tm.what?'<div class="kt-row"><b>是什么</b>'+esc(tm.what)+'</div>':'') +
          (tm.why?'<div class="kt-row"><b>为什么重要</b>'+esc(tm.why)+'</div>':'') +
          (tm.eg?'<div class="kt-row"><b>例子</b>'+esc(tm.eg)+'</div>':'') +
          (tm.one?'<div class="kt-row"><b>一句话</b>'+esc(tm.one)+'</div>':'') +
          '</div>';
      }
      html += '</div>';
    }
    // 时代卡
    if(s.eras){
      html += '<div class="kb-eras">';
      for(var e1=0;e1<s.eras.length;e1++){
        var er = s.eras[e1];
        html += '<div class="kb-era"><div class="ke-year">'+esc(er.y)+'</div><b>'+esc(er.t)+'</b>' +
          '<div class="ke-key"><em>记住：</em>'+esc(er.key)+'</div><p>'+esc(er.d)+'</p></div>';
      }
      html += '</div>';
    }
    // 内嵌时间线
    if(s.timeline) html += renderTimelineItems(s.timeline);
    // 金句
    if(s.quote) html += '<div class="kb-quote">' + esc(s.quote) + (s.quoteNote?'<span class="kq-note">'+esc(s.quoteNote)+'</span>':'') + '</div>';
    if(s.ps2) for(var e2=0;e2<s.ps2.length;e2++) html += '<p>' + esc(s.ps2[e2]) + '</p>';
    html += '</div>';
  }
  return html;
}

function renderTimeline(c){
  return renderTimelineItems(c.items);
}

function renderList(c){
  var fragment = document.createDocumentFragment();
  if(c.chips){
    var chips = document.createElement('div');
    chips.className = 'filter-chips';
    for(var i=0;i<c.chips.length;i++){
      var chip = document.createElement('span');
      chip.className = 'chip' + (i===0 ? ' active' : '');
      chip.textContent = c.chips[i];
      chips.appendChild(chip);
    }
    fragment.appendChild(chips);
  }
  for(var g=0;g<c.groups.length;g++){
    var grp = c.groups[g];
    var section = document.createElement('div');
    section.className = 'rt-sec';
    section.setAttribute('data-key',grp.name);
    section.style.marginBottom = '22px';
    var heading = document.createElement('h3');
    heading.textContent = grp.name;
    section.appendChild(heading);
    var card = document.createElement('div');
    card.className = 'detail-card';
    card.style.boxShadow = 'none';
    for(var j=0;j<grp.items.length;j++){
      var it = grp.items[j];
      var safeUrl = it.url ? safeHttpUrl(it.url) : '';
      var row = document.createElement(safeUrl ? 'a' : 'div');
      row.className = 'p-row' + (safeUrl ? ' p-link' : '');
      row.style.borderBottom = j < grp.items.length-1 ? '1px dashed var(--line)' : 'none';
      if(safeUrl){
        row.href = safeUrl;
        row.target = '_blank';
        row.rel = 'noopener';
      }
      var logo = document.createElement('span');
      logo.className = 'p-logo' + (j%2 ? ' alt' : '');
      logo.textContent = it.logo;
      var info = document.createElement('div');
      info.className = 'p-info';
      var title = document.createElement('b');
      title.appendChild(document.createTextNode(it.name + ' '));
      var badge = document.createElement('span');
      badge.className = 'p-badge';
      badge.textContent = it.badge;
      title.appendChild(badge);
      var desc = document.createElement('small');
      desc.textContent = it.desc;
      info.appendChild(title);
      info.appendChild(desc);
      row.appendChild(logo);
      row.appendChild(info);
      if(safeUrl){
        var arrow = document.createElement('span');
        arrow.className = 'p-arrow';
        arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
        row.appendChild(arrow);
      }
      card.appendChild(row);
    }
    section.appendChild(card);
    fragment.appendChild(section);
  }
  return fragment;
}

function initListFilter(){
  var body = document.getElementById('dcBody');
  if(!body) return;
  var chips = body.querySelectorAll('.filter-chips .chip');
  var secs = body.querySelectorAll('.rt-sec[data-key]');
  if(chips.length < 2 || !secs.length) return;
  for(var i=0;i<chips.length;i++){
    chips[i].style.cursor = 'pointer';
    chips[i].addEventListener('click', function(){
      var me = this;
      for(var j=0;j<chips.length;j++) chips[j].classList.remove('active');
      me.classList.add('active');
      var key = me.textContent.trim();
      // 支持「/」分隔的多关键字（如「产品/行业」匹配「产品与行业视角」）
      var keys = key.split('/');
      for(var k=0;k<secs.length;k++){
        var kk = secs[k].getAttribute('data-key') || '';
        var hit = (key==='全部');
        if(!hit){
          for(var m=0;m<keys.length;m++){
            if(keys[m] && kk.indexOf(keys[m].trim())>-1){ hit = true; break; }
          }
        }
        secs[k].style.display = hit ? '' : 'none';
      }
    });
  }
}

function renderVideoList(id){
  var real = safeOwnGet(VIDEO_REAL, id) || [];
  var thumbs = ['thumb-landscape','thumb-stars','thumb-aurora'];
  if(!real.length){
    var placeholder = document.createElement('div');
    placeholder.className = 'placeholder-note';
    placeholder.style.marginTop = '0';
    placeholder.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><p><b>暂无回放：</b>该分类还没有接入真实录播，敬请期待。</p>';
    return placeholder;
  }
  var list = document.createElement('div');
  list.className = 'sk-vlist';
  for(var r=0;r<real.length;r++){
    var it = real[r];
    var safeUrl = safeHttpUrl(it.url);
    var item = document.createElement(safeUrl ? 'a' : 'div');
    item.className = 'sk-vcard rv-real';
    if(safeUrl){
      item.href = safeUrl;
      item.target = '_blank';
      item.rel = 'noopener';
    }
    var thumb = document.createElement('div');
    thumb.className = 'sk-thumb ' + thumbs[r%3];
    var tag = document.createElement('span');
    tag.className = 'rv-badge-demo rv-badge-real';
    tag.textContent = it.tag;
    var play = document.createElement('span');
    play.className = 'play';
    play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8V4z"/></svg>';
    var duration = document.createElement('span');
    duration.className = 'rv-dur-txt';
    duration.textContent = '回放';
    thumb.appendChild(tag);
    thumb.appendChild(play);
    thumb.appendChild(duration);
    var itemBody = document.createElement('div');
    itemBody.className = 'sk-body';
    var itemTitle = document.createElement('b');
    itemTitle.className = 'rv-title';
    itemTitle.textContent = it.title;
    var meta = document.createElement('div');
    meta.className = 'rv-meta';
    meta.innerHTML = '<span>AI 赋能小组</span><span>SharePoint 回放</span>';
    var tagRow = document.createElement('div');
    tagRow.className = 'rv-tagrow';
    tagRow.innerHTML = '<span>点击观看 ↗</span>';
    itemBody.appendChild(itemTitle);
    itemBody.appendChild(meta);
    itemBody.appendChild(tagRow);
    item.appendChild(thumb);
    item.appendChild(itemBody);
    list.appendChild(item);
  }
  return list;
}

/* ================= 渲染主流程 ================= */
(function(){
  var type = qs('type'), id = qs('id');
  var beginnerRuntime = safeOwnGet(window, 'AIBeginner');
  var aliasMap = beginnerRuntime ? safeOwnGet(beginnerRuntime, 'aliases') : undefined;
  var canonicalId = type === 'learn' ? safeOwnGet(aliasMap, id) : undefined;
  if(typeof canonicalId === 'string'){
    id = canonicalId;
    try {
      var canonicalUrl = new URL(window.location.href);
      canonicalUrl.searchParams.set('type', 'learn');
      canonicalUrl.searchParams.set('id', id);
      var replaceState = history.replaceState;
      if(typeof replaceState === 'function') replaceState.call(history, history.state || null, '', canonicalUrl.pathname + canonicalUrl.search + canonicalUrl.hash);
    } catch(aliasError) {}
  }
  var board = safeOwnGet(CONFIG, type);
  var subs = board ? safeOwnGet(board, 'subs') : undefined;
  var sub = safeOwnGet(subs, id);
  if(!sub){
    if(type === 'learn'){
      board = safeOwnGet(CONFIG, 'learn') || { nav:'learn', crumb:'AI 新手入门', num:'01 · LEARN' };
      sub = { name:'暂未找到这一章', accent:'#2563EB', structure:'learning-unknown', desc:'返回 AI 新手入门，从六个章节中重新选择。', meta:['未找到章节'] };
    } else {
      type = 'learn';
      board = safeOwnGet(CONFIG, 'learn') || { nav:'learn', crumb:'AI 新手入门', num:'404' };
      sub = { name:'页面未找到', accent:'#2563EB', structure:'page-unknown', desc:'请返回 AI 新手入门继续浏览。', meta:['404'] };
    }
  }

  var accent = sub.accent;

  // 1) 导航高亮
  var navLinks = document.querySelectorAll('.nav-links a[data-nav]');
  for(var i=0;i<navLinks.length;i++){
    if(navLinks[i].getAttribute('data-nav') === board.nav) navLinks[i].classList.add('active');
  }

  // 2) 面包屑
  document.getElementById('crumb').innerHTML =
    '<a href="index.html">首页</a>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
    '<a href="' + type + '.html">' + esc(board.crumb) + '</a>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
    '<span class="cur">' + esc(sub.name) + '</span>';

  // 3) Hero
  var hero = document.getElementById('detailHero');
  hero.hidden = sub.structure === 'learning' || sub.structure === 'learning-unknown';
  hero.style.setProperty('--accent', accent);
  document.getElementById('dhTag').textContent = board.num + ' · ' + board.crumb + ' / ' + sub.name;
  document.getElementById('dhTitle').textContent = sub.name;
  document.getElementById('dhDesc').textContent = sub.desc;
  var metaHtml = '';
  for(var m=0;m<sub.meta.length;m++) metaHtml += '<span>' + esc(sub.meta[m]) + '</span>';
  document.getElementById('dhMeta').innerHTML = metaHtml;

  // 4) 内容
  document.title = sub.name + ' · 亚玛芬 AI 知识库';
  var bodyEl = document.getElementById('dcBody');
  bodyEl.style.setProperty('--accent', accent);

  var titleEl = document.getElementById('dcTitle');
  var noteEl = document.getElementById('dcNote');
  var phBox = document.getElementById('phNoteBox');
  var phNote = document.getElementById('phNote');

  var content = safeOwnGet(CONTENT, id);
  switch(sub.structure){
    case 'learning':
      titleEl.textContent = '轻量学习'; noteEl.textContent = 'LEARN · TRY · REVIEW';
      if(beginnerRuntime && typeof beginnerRuntime.renderChapter === 'function'){
        beginnerRuntime.renderChapter(id, bodyEl);
      } else {
        bodyEl.textContent = '学习内容暂时无法加载，请返回 AI 新手入门重试。';
      }
      break;
    case 'learning-unknown':
      titleEl.textContent = '未找到章节'; noteEl.textContent = 'RETURN TO LEARN';
      if(beginnerRuntime && typeof beginnerRuntime.renderChapter === 'function') beginnerRuntime.renderChapter(id, bodyEl);
      else bodyEl.textContent = '暂未找到这一章。请返回 AI 新手入门。';
      break;
    case 'page-unknown':
      titleEl.textContent = '页面未找到'; noteEl.textContent = '404';
      var unknownMessage = document.createElement('p');
      unknownMessage.textContent = '当前链接无法识别，请返回 AI 新手入门。';
      var unknownReturn = document.createElement('a');
      unknownReturn.className = 'lesson-primary-action';
      unknownReturn.href = 'learn.html';
      unknownReturn.textContent = '返回 AI 新手入门';
      bodyEl.replaceChildren(unknownMessage, unknownReturn);
      break;
    case 'article':
      titleEl.textContent = '正文'; noteEl.textContent = 'ARTICLE';
      bodyEl.innerHTML = content ? renderArticle(content) : '';
      break;
    case 'timeline':
      titleEl.textContent = '时间线'; noteEl.textContent = 'TIMELINE';
      bodyEl.innerHTML = content ? renderTimeline(content) : '';
      break;
    case 'list':
      titleEl.textContent = '清单'; noteEl.textContent = 'LIST';
      if(content) bodyEl.replaceChildren(renderList(content)); else bodyEl.textContent = '';
      initListFilter();
      break;
    case 'video-list':
      titleEl.textContent = '课程回放'; noteEl.textContent = 'VIDEO LIST';
      bodyEl.replaceChildren(renderVideoList(id));
      var realVideos = safeOwnGet(VIDEO_REAL, id);
      if(realVideos && realVideos.length){
        phBox.style.display = 'flex';
        phNote.innerHTML = '<b>点击卡片即可观看：</b>以下为已接入的真实录播，点击会跳转到公司 SharePoint 站点观看（需登录公司账号）。';
      } else {
        phBox.style.display = 'none';
      }
      break;
  }
  syncTableScrollState();
})();
